<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glowNode">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .node-code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; font-weight: 600; }
  </style>

  <rect width="1100" height="360" rx="16" fill="url(#flowBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="40" y="42" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">
    END-TO-END VENDOR ASSESSMENT &amp; REMEDIATION PIPELINE
  </text>
  <text x="40" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">
    Automated zero-trust progression from third-party onboarding to cryptographic executive audit sign-off
  </text>

  <!-- Flow Connecting Lines -->
  <path d="M 205,190 L 260,190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 430,190 L 485,190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 655,190 L 710,190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 880,190 L 935,190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- STEP 1: Onboard -->
  <g transform="translate(40, 100)">
    <rect width="165" height="180" rx="14" fill="url(#card1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="165" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="28" cy="30" r="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="34" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">01</text>
    <text x="48" y="34" class="node-title">Vendor Registry</text>
    
    <text x="16" y="70" class="node-sub">• Tier 1 / 2 / 3 Classification</text>
    <text x="16" y="90" class="node-sub">• Data Classification Guard</text>
    <text x="16" y="110" class="node-sub">• External Contact Scope</text>
    
    <rect x="16" y="135" width="133" height="24" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8"/>
    <text x="24" y="151" fill="#7dd3fc" class="node-code">STATUS: ONBOARDED</text>
  </g>

  <!-- STEP 2: Questionnaire -->
  <g transform="translate(265, 100)">
    <rect width="165" height="180" rx="14" fill="url(#card1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="165" height="4" rx="2" fill="#6366f1"/>
    <circle cx="28" cy="30" r="12" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="24" y="34" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="800">02</text>
    <text x="48" y="34" class="node-title">Questionnaire</text>
    
    <text x="16" y="70" class="node-sub">• SIG Lite 2026 &amp; NIST CSF</text>
    <text x="16" y="90" class="node-sub">• Mandatory N/A Justification</text>
    <text x="16" y="110" class="node-sub">• State-Lock on Submit</text>
    
    <rect x="16" y="135" width="133" height="24" rx="6" fill="#312e81" fill-opacity="0.3" stroke="#6366f1" stroke-width="0.8"/>
    <text x="24" y="151" fill="#a5b4fc" class="node-code">LOCKED FOR REVIEW</text>
  </g>

  <!-- STEP 3: Evidence & AI -->
  <g transform="translate(490, 100)">
    <rect width="165" height="180" rx="14" fill="url(#card1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="165" height="4" rx="2" fill="url(#accentPurple)"/>
    <circle cx="28" cy="30" r="12" fill="#9333ea" fill-opacity="0.2"/>
    <text x="24" y="34" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="800">03</text>
    <text x="48" y="34" class="node-title">Evidence &amp; AI</text>
    
    <text x="16" y="70" class="node-sub">• Magic-Byte Sanitization</text>
    <text x="16" y="90" class="node-sub">• ClamAV Quarantine Vault</text>
    <text x="16" y="110" class="node-sub">• Injection-Shielded AI</text>
    
    <rect x="16" y="135" width="133" height="24" rx="6" fill="#581c87" fill-opacity="0.3" stroke="#a855f7" stroke-width="0.8"/>
    <text x="24" y="151" fill="#e9d5ff" class="node-code">HUMAN-IN-THE-LOOP</text>
  </g>

  <!-- STEP 4: Risk Scoring -->
  <g transform="translate(715, 100)">
    <rect width="165" height="180" rx="14" fill="url(#card1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="165" height="4" rx="2" fill="#f59e0b"/>
    <circle cx="28" cy="30" r="12" fill="#d97706" fill-opacity="0.2"/>
    <text x="24" y="34" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">04</text>
    <text x="48" y="34" class="node-title">5×5 Risk Engine</text>
    
    <text x="16" y="70" class="node-sub">• Inherent Likelihood × Impact</text>
    <text x="16" y="90" class="node-sub">• Control Effectiveness Delta</text>
    <text x="16" y="110" class="node-sub">• Gap Finding Auto-Creation</text>
    
    <rect x="16" y="135" width="133" height="24" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="24" y="151" fill="#fef08a" class="node-code">RESIDUAL COMPUTED</text>
  </g>

  <!-- STEP 5: Remediation & PDF -->
  <g transform="translate(940, 100)">
    <rect width="130" height="180" rx="14" fill="url(#card1)" stroke="#059669" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="130" height="4" rx="2" fill="url(#accentEmerald)"/>
    <circle cx="24" cy="30" r="12" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="34" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">05</text>
    <text x="42" y="34" class="node-title">Audit Sign-Off</text>
    
    <text x="12" y="70" class="node-sub">• SLA Remediations</text>
    <text x="12" y="90" class="node-sub">• Risk Acceptance</text>
    <text x="12" y="110" class="node-sub">• Signed PDF Dossier</text>
    
    <rect x="12" y="135" width="106" height="24" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8"/>
    <text x="18" y="151" fill="#a7f3d0" class="node-code">SHA-256 SIGNED</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(40, 305)">
    <rect width="1020" height="34" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">
      SECURITY POLICIES ENFORCED:
    </text>
    <text x="200" y="22" fill="#38bdf8" font-family="monospace" font-size="11">
      [✓ Tenant IDOR Isolation]  [✓ Zero Data Poisoning]  [✓ Strict Human-in-the-Loop AI]  [✓ Tamper-Evident Audit Records]
    </text>
  </g>
</svg>
