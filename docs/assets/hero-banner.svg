<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Mesh Glow Radians -->
    <radialGradient id="meshBlue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshCyan" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshPurple" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowShield" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#cyberGrid)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="420" fill="url(#meshBlue)"/>
  <rect width="1200" height="420" fill="url(#meshCyan)"/>
  <rect width="1200" height="420" fill="url(#meshPurple)"/>

  <!-- Border & Top Accent Line -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#1e293b" stroke-width="1"/>
  <line x1="150" y1="1" x2="1050" y2="1" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Emblem / Icon Graphic -->
  <g transform="translate(100, 110)">
    <!-- Outer Glow Circle -->
    <circle cx="90" cy="90" r="85" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <circle cx="90" cy="90" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Pulse radar rings -->
    <circle cx="90" cy="90" r="68" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.4"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

    <!-- Glowing Cyber Shield -->
    <g filter="url(#glowShield)">
      <path d="M 90,30 L 140,55 C 140,110 115,145 90,160 C 65,145 40,110 40,55 Z" fill="url(#shieldGrad)" opacity="0.9"/>
      <!-- Inner Shield Highlight -->
      <path d="M 90,40 L 130,60 C 130,105 110,135 90,148 C 70,135 50,105 50,60 Z" fill="#0b132b" opacity="0.7"/>
      <!-- Center Eye / Focal Point -->
      <circle cx="90" cy="90" r="14" fill="#38bdf8"/>
      <circle cx="90" cy="90" r="6" fill="#ffffff"/>
      <path d="M 68,90 Q 90,65 112,90 Q 90,115 68,90 Z" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Title & Typography Section -->
  <g transform="translate(340, 115)">
    <!-- Pro Tag -->
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="26" y="17" fill="#7dd3fc" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">ZERO-TRUST TPRM</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" class="font-sans" font-size="52" font-weight="900" letter-spacing="-1">
      Third<tspan fill="url(#textGrad)">Sight</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="112" fill="#94a3b8" class="font-sans" font-size="16" font-weight="500">
      Enterprise Third-Party Security Intelligence &amp; Automated Vendor Risk Quantification
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#38bdf8"/>
      <text x="28" y="20" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600">Deterministic 5×5 Matrix</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="191" cy="16" r="3.5" fill="#a855f7"/>
      <text x="203" y="20" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600">AI Evidence Verification</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="175" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="381" cy="16" r="3.5" fill="#10b981"/>
      <text x="393" y="20" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600">Zero-Trust IDOR Guard</text>

      <!-- Pill 4 -->
      <rect x="550" y="0" width="160" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="566" cy="16" r="3.5" fill="#f59e0b"/>
      <text x="578" y="20" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600">SHA-256 Audit Trail</text>
    </g>
  </g>

  <!-- Right Floating Metric Widget -->
  <g transform="translate(940, 65)">
    <!-- Glow Backdrop -->
    <rect x="-10" y="-10" width="220" height="150" rx="18" fill="#0369a1" opacity="0.15" filter="url(#glowCyan)"/>
    <!-- Card Frame -->
    <rect x="0" y="0" width="200" height="130" rx="14" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="28" fill="#64748b" class="font-sans" font-size="10" font-weight="700" letter-spacing="1">MEAN RESIDUAL RISK</text>
    <text x="18" y="66" fill="#38bdf8" class="font-sans" font-size="34" font-weight="900">74<tspan font-size="16" fill="#64748b">/100</tspan></text>
    <!-- Status Badge -->
    <rect x="18" y="82" width="105" height="22" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.8"/>
    <circle cx="28" cy="93" r="3" fill="#34d399"/>
    <text x="36" y="97" fill="#6ee7b7" class="font-sans" font-size="10" font-weight="700">RESILIENT (-14 pts)</text>
  </g>

  <!-- Bottom Terminal Bar -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="1000" height="34" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="32" cy="17" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="46" cy="17" r="4" fill="#10b981" opacity="0.8"/>
    <text x="70" y="21" fill="#64748b" class="font-mono" font-size="12">
      <tspan fill="#38bdf8">secops@thirdsight</tspan>:<tspan fill="#94a3b8">~#</tspan> uvicorn app.main:app --workers 4 --ssl-keyfile /etc/ssl/cert.key <tspan fill="#10b981">[STATUS: HEALTHY - 26/26 REGRESSION TESTS PASSING]</tspan>
    </text>
  </g>
</svg>

